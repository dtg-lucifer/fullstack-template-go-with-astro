# Air configuration for hot reloading during development
# Run with: air  (or: make dev)
root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -tags dev -o ./tmp/main ."
  bin = "./tmp/main"
  full_bin = "./tmp/main -config config.yaml"
  include_ext = ["go", "yaml", "sql"]
  exclude_dir = ["vendor", "tmp", "bin", "logs", "web/node_modules", "web/dist", "server/internal/db/repository"]
  delay = 1000
  stop_on_error = true
  send_interrupt = true
  kill_delay = 500

[log]
  time = true

[color]
  main = "magenta"
  watcher = "cyan"
  build = "yellow"
  runner = "green"

[misc]
  clean_on_exit = true
