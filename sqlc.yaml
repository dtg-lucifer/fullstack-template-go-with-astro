version: "2"
sql:
  - engine: "postgresql"
    queries: "server/internal/db/queries"
    schema: "server/internal/db/migrations"
    gen:
      go:
        package: "repository"
        out: "server/internal/db/repository"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_enum_valid_method: true
        emit_pointers_for_null_types: true
